[build]
  command = "python3 build.py"
  publish = "dist"

# Pages: always check for the latest version
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS and JS: the URL changes (?v=...) whenever the file changes, so browsers can keep them for a year
[[headers]]
  for = "/static/site.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images, clips and the showreel: keep for a week, quietly refresh in the background after that
[[headers]]
  for = "/static/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/static/reel/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
